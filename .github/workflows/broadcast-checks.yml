name: Broadcast system checks

on:
  push:
    paths:
      - 'vite-project/**'
      - '.github/workflows/broadcast-checks.yml'
  pull_request:
    paths:
      - 'vite-project/**'
      - '.github/workflows/broadcast-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broadcast-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: vite-project
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        run: |
          mkdir -p artifacts/ci
          npm ci 2>&1 | tee artifacts/ci/install.log

      - name: Audit production dependencies
        run: npm audit --omit=dev 2>&1 | tee artifacts/ci/dependency-audit.log

      - name: Build production application
        run: npm run build 2>&1 | tee artifacts/ci/build.log

      - name: Lint
        run: npm run lint 2>&1 | tee artifacts/ci/lint.log

      - name: Check recognition and OBS code formatting
        run: npm run format:check 2>&1 | tee artifacts/ci/format.log

      - name: Run unit and server tests
        run: npm test 2>&1 | tee artifacts/ci/tests.log

      - name: Validate launcher process ownership and locking
        run: pwsh -NoProfile -File scripts/managed-process.test.ps1 2>&1 | tee artifacts/ci/launchers.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium 2>&1 | tee artifacts/ci/browser-install.log

      - name: Run all browser regressions
        run: npm run test:e2e -- --reporter=line,html 2>&1 | tee artifacts/ci/browser-tests.log

      - name: Upload failure logs, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-checks-failure-${{ github.run_attempt }}
          path: |
            vite-project/artifacts/ci/
            vite-project/artifacts/e2e-*/server.log
            vite-project/artifacts/**/*.png
            vite-project/test-results/
            vite-project/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: vite-project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Validate launcher ownership and locking
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/managed-process.test.ps1

      - name: Exercise real Windows launcher lifecycle
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/launcher-smoke.test.ps1

      - name: Verify Windows native image recognition
        run: node --import tsx --test server/capture-native.test.ts

      - name: Upload Windows launcher failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-failure-${{ github.run_attempt }}
          path: vite-project/artifacts/*.log
          if-no-files-found: ignore
          retention-days: 14
