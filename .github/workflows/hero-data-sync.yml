name: Hero data sync

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'vite-project/scripts/hero-sync/**'
      - 'README.md'
      - 'MILESTONES.md'
      - 'docs/research/README.md'
      - 'docs/research/hero-sync.md'
      - 'docs/research/hero-roster.md'
      - 'docs/validation/history.md'
      - 'vite-project/src/data/autoSyncedHeroes.ts'
      - 'vite-project/src/data/heroSyncOverrides.ts'
      - 'vite-project/src/components/HeroList.tsx'
      - 'vite-project/src/data/heroTypes.ts'
      - 'vite-project/src/overlay/DraftOverlay.tsx'
      - 'vite-project/src/BroadcastApp.tsx'
      - 'vite-project/src/BroadcastApp.css'
      - 'vite-project/src/control/TeamSettingsDialog.tsx'
      - 'vite-project/src/control/HeroArtEditorDialog.tsx'
      - 'vite-project/src/control/ControlHeroPicker.tsx'
      - 'vite-project/src/control/ScreenInput.tsx'
      - 'vite-project/src/control/emptyBanDetection.ts'
      - 'vite-project/src/control/bpCaptureLayout.ts'
      - 'vite-project/src/control/heroRecognitionStability.ts'
      - 'vite-project/src/control/pickTurnDimDetection.ts'
      - 'vite-project/src/control/pickSlotActivation.ts'
      - 'vite-project/src/control/sharedWindowCapture.ts'
      - 'vite-project/src/control/windowCaptureGeometry.ts'
      - 'vite-project/src/control/precisionCalibration.ts'
      - 'vite-project/src/control/captureSlotPresets.ts'
      - 'vite-project/src/control/heroSort.ts'
      - 'vite-project/src/control/control.css'
      - 'vite-project/src/simulator/**'
      - 'vite-project/server/bpSimulator.test.ts'
      - 'vite-project/src/main.tsx'
      - 'vite-project/package.json'
      - 'vite-project/package-lock.json'
      - 'vite-project/start-bp-simulator.bat'
      - 'vite-project/stop-bp-simulator.bat'
      - 'vite-project/run-bp-simulator.ps1'
      - 'docs/research/lol-feature-parity-audit-2026-10-06.md'
      - 'vite-project/src/control/LineupAssignments.tsx'
      - 'vite-project/src/control/PlayerSlotAlignment.tsx'
      - 'vite-project/src/control/playerIdRegionPresets.ts'
      - 'vite-project/src/control/DraftLifecycle.tsx'
      - 'vite-project/src/shared/DraftHistory.tsx'
      - 'vite-project/server/capture.ts'
      - 'vite-project/server/capture.test.ts'
      - 'vite-project/server/emptyBanDetection.test.ts'
      - 'vite-project/server/bpCaptureLayout.test.ts'
      - 'vite-project/server/heroRecognitionStability.test.ts'
      - 'vite-project/server/pickTurnDimDetection.test.ts'
      - 'vite-project/server/pickSlotActivation.test.ts'
      - 'vite-project/server/draftTurns.test.ts'
      - 'vite-project/server/windowCaptureGeometry.test.ts'
      - 'vite-project/server/precisionCalibration.test.ts'
      - 'vite-project/server/captureSlotPresets.test.ts'
      - 'vite-project/server/server.ts'
      - 'vite-project/server/playerRecognition.ts'
      - 'vite-project/server/playerRecognition.test.ts'
      - 'vite-project/server/playerSlots.test.ts'
      - 'vite-project/scripts/capture/recognize.ps1'
      - 'vite-project/server/draftRules.test.ts'
      - 'vite-project/e2e/v22.spec.ts'
      - 'vite-project/e2e/milestones.spec.ts'
      - 'vite-project/src/shared/i18n.ts'
      - 'vite-project/src/shared/playerSlots.ts'
      - 'vite-project/src/shared/types.ts'
      - 'vite-project/src/shared/draftTurns.ts'
      - 'vite-project/src/shared/draftRules.ts'
      - 'vite-project/src/shared/errorMessages.ts'
      - 'vite-project/server/store.ts'
      - 'vite-project/server/store.test.ts'
      - 'vite-project/src/data/heroArtFocus.ts'
      - 'vite-project/src/data/heroArtFocusOverrides.ts'
      - 'vite-project/src/data/heroArtSourceOverrides.ts'
      - 'vite-project/sync-hero-crops.bat'
      - '.github/workflows/hero-data-sync.yml'
  workflow_dispatch:
  schedule:
    # Weekly check. The synchronizer is intentionally not part of match startup.
    - cron: '17 10 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        working-directory: vite-project
        run: npm ci

      - name: Validate hero data
        working-directory: vite-project
        run: npm run hero:validate

      - name: Build
        working-directory: vite-project
        run: npm run build

      - name: Run tests
        working-directory: vite-project
        run: npm test

      - name: Lint
        working-directory: vite-project
        run: npm run lint

  sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        working-directory: vite-project
        run: npm ci

      - name: Check remote hero roster
        id: check
        working-directory: vite-project
        shell: bash
        run: |
          npm --silent run hero:check -- --json > hero-check.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('hero-check.json', 'utf8'));
          console.log(JSON.stringify(result, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed}\n`);
          NODE
          rm hero-check.json

      - name: Prepare candidate hero update
        if: steps.check.outputs.changed == 'true'
        working-directory: vite-project
        run: npm run hero:sync

      - name: Validate hero data
        if: steps.check.outputs.changed == 'true'
        working-directory: vite-project
        run: npm run hero:validate

      - name: Build
        if: steps.check.outputs.changed == 'true'
        working-directory: vite-project
        run: npm run build

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        working-directory: vite-project
        run: npm test

      - name: Lint
        if: steps.check.outputs.changed == 'true'
        working-directory: vite-project
        run: npm run lint

      - name: Open or update review PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/hero-data-sync
          delete-branch: true
          commit-message: 'data: refresh HOK global hero roster'
          title: 'Hero data sync: review latest global roster'
          body: |
            Automated weekly hero-roster candidate update.

            Safety rules:
            - this workflow never edits main directly;
            - local hero IDs are append-only and are never replaced by remote/Camp IDs;
            - remote omissions create warnings and never delete local heroes;
            - counter, combo, and beCountered are never scraped or overwritten;
            - new/renamed heroes use the public catalog for discovery and official HOK IP pages/CDN assets as supporting evidence where available;
            - lane changes from the auxiliary catalog are reported for manual review instead of being auto-applied.

            Please inspect the generated audit JSON under research/hero-sync/, then merge only after the diff looks correct.
          add-paths: |
            vite-project/src/data/autoSyncedHeroes.ts
            vite-project/src/data/heroSyncOverrides.ts
            vite-project/public/heroesImg/
            research/hero-sync/
            docs/research/hero-roster.md
            MILESTONES.md
            docs/research/README.md
            docs/research/hero-sync.md
